name: Apply Guru AI custom-subject update

on:
  push:
    branches: ["update/custom-subject-support"]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[apply-custom-subject]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply safe feature patch
        run: python3 scripts/apply-custom-subject-update.py
      - name: Remove patch tooling
        run: |
          rm -f scripts/apply-custom-subject-update.py
          rm -f .github/workflows/apply-custom-subject.yml
      - name: Commit patched application
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add custom subject AI analysis support"
          git push
